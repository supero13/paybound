[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Aevum runs cdk-erigon (zkEVM-style); stick to the paris opcode set (no PUSH0/MCOPY).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fuzz = { runs = 512 }

[rpc_endpoints]
aevum = "${AEVUM_RPC_URL}"

[lint]
exclude_lints = ["block-timestamp"]
